version: "3.8"

services:
  database:
    image: postgres:16-alpine
    cpus: ${SKYNEST_DATABASE_CPUS:-3.0}
    mem_limit: ${SKYNEST_DATABASE_MEMORY:-7g}
    environment:
      POSTGRES_DB: skynest
      POSTGRES_USER: skynest
      POSTGRES_PASSWORD: skynest
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skynest -d skynest"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      localnet:
        ipv4_address: 172.16.72.163
  backend:
    build: ./backend
    cpus: ${SKYNEST_BACKEND_CPUS:-12.0}
    mem_limit: ${SKYNEST_BACKEND_MEMORY:-24g}
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://skynest:skynest@database:5432/skynest
      JWT_SECRET: replace-this-with-a-long-random-secret
      # Credentials for initial administrator
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: admin
      STORAGE_ROOT: /app/storage
      # Global SkyNest capacity. Default: 1 TiB (1024^4 bytes).
      STORAGE_LIMIT_BYTES: ${SKYNEST_STORAGE_LIMIT_BYTES:-1099511627776}
      CORS_ORIGIN: http://localhost:8080
    volumes:
      # Override SKYNEST_STORAGE_PATH in .env if the host mount changes.
      - ${SKYNEST_STORAGE_PATH:-/media/it-bro/DATA2TB/SkyNest}:/app/storage
    depends_on:
      database:
        condition: service_healthy
    networks:
      localnet:
        ipv4_address: 172.16.72.162
  frontend:
    build: ./frontend
    cpus: ${SKYNEST_FRONTEND_CPUS:-1.0}
    mem_limit: ${SKYNEST_FRONTEND_MEMORY:-1g}
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      localnet:
        ipv4_address: 172.16.72.161 # IP Statis Frontend

volumes:
  postgres_data:

networks:
  localnet:
    name: localnet
    external: true
