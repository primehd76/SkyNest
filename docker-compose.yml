services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skynest
      POSTGRES_USER: skynest
      POSTGRES_PASSWORD: change-this-database-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skynest -d skynest"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://skynest:change-this-database-password@database:5432/skynest
      JWT_SECRET: replace-this-with-a-long-random-secret
      # These credentials create the first administrator only when no users exist.
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: change-this-admin-password
      STORAGE_ROOT: /app/storage
      CORS_ORIGIN: http://localhost:8080
    volumes:
      # Change the left-hand path if the host mount differs on your server.
      - /media/DATA2TB/SkyNest:/app/storage
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
