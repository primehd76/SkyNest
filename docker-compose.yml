version: "3.8"

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skynest
      POSTGRES_USER: skynest
      POSTGRES_PASSWORD: skynest
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skynest -d skynest"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      localnet:
        ipv4_address: 172.16.72.163
  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://skynest:skynest@database:5432/skynest
      JWT_SECRET: replace-this-with-a-long-random-secret
      # Credentials for initial administrator
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: admin
      STORAGE_ROOT: /app/storage
      CORS_ORIGIN: http://localhost:8080
    volumes:
      - /media/DATA2TB/SkyNest:/app/storage
    depends_on:
      database:
        condition: service_healthy
    networks:
      localnet:
        ipv4_address: 172.16.72.162
  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      localnet:
        ipv4_address: 172.16.72.161 # IP Statis Frontend

volumes:
  postgres_data:

networks:
  localnet:
    name: localnet
    external: true
