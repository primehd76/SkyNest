version: "3.8"

services:
  database:
    image: postgres:16-alpine
    cpus: 2.0
    mem_limit: 2g
    environment:
      POSTGRES_DB: skynest
      POSTGRES_USER: skynest
      # Change this value once; PGPASSWORD below reuses it through the YAML anchor.
      POSTGRES_PASSWORD: &database_password database_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skynest -d skynest"]
      interval: 5s
      timeout: 5s
      retries: 12
    expose:
      - "5432"
    networks:
      - skynest_net
  backend:
    build: ./backend
    cpus: 6.0
    mem_limit: 4g
    environment:
      PORT: 4000
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: skynest
      PGUSER: skynest
      PGPASSWORD: *database_password
      JWT_SECRET: random_secret_credential_
      # Credentials for initial administrator
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: admin_password
      STORAGE_ROOT: /app/storage
      # Global SkyNest capacity. Default: 1 TiB (1024^4 bytes).
      STORAGE_LIMIT_BYTES: 1099511627776
      # Optional host disk health probe. Change this when the host uses another device.
      DISK_HEALTH_DEVICE: /dev/sda
      CORS_ORIGIN: http://localhost:8080
    volumes:
      - /media/DATA2TB/SkyNest:/app/storage
      - /sys/class/thermal:/sys/class/thermal:ro
    devices:
      - /dev/sda:/dev/sda
    cap_add:
      - SYS_RAWIO
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "4000"
    networks:
      - skynest_net
  frontend:
    build: ./frontend
    cpus: 1.0
    mem_limit: 512m
    depends_on:
      - backend
    # OPTION A - follow the host IP address.
    # Access SkyNest with http://<host-ip>:8080.
    ports:
      - "8080:8080"
    networks:
      - skynest_net

    # OPTION B - static LAN IP through your existing macvlan network.
    # To use this, comment the ports block above, then uncomment this
    # networks block and the localnet block at the bottom of this file.
    # networks:
    #   skynest_net:
    #   localnet:
    #     ipv4_address: 192.168.1.111

volumes:
  postgres_data:

networks:
  skynest_net:
    driver: bridge

  # OPTION B support - uncomment when frontend uses macvlan static IP.
  # localnet:
  #   external: true
  #   name: localnet
