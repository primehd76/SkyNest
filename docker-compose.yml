version: "3.8"

services:
  database:
    image: postgres:16-alpine
    cpus: 3.0
    mem_limit: 7g
    environment:
      POSTGRES_DB: skynest
      POSTGRES_USER: skynest
      # Change this value once; PGPASSWORD below reuses it through the YAML anchor.
      POSTGRES_PASSWORD: &database_password skynestITt7
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skynest -d skynest"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      localnet:
        ipv4_address: 172.16.72.163
  backend:
    build: ./backend
    cpus: 12.0
    mem_limit: 24g
    environment:
      PORT: 4000
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: skynest
      PGUSER: skynest
      PGPASSWORD: *database_password
      JWT_SECRET: bidji_qoeda-belati-alibabah
      # Credentials for initial administrator
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: adminITt7
      STORAGE_ROOT: /app/storage
      # Global SkyNest capacity. Default: 1 TiB (1024^4 bytes).
      STORAGE_LIMIT_BYTES: 1099511627776
      # Optional host disk health probe. Change this when the host uses another device.
      DISK_HEALTH_DEVICE: /dev/sda
      CORS_ORIGIN: http://localhost:8080
    volumes:
      - /media/DATA2TB/SkyNest:/app/storage
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /sys/class/thermal:/sys/class/thermal:ro
    devices:
      - /dev/sda:/dev/sda
    depends_on:
      database:
        condition: service_healthy
    networks:
      localnet:
        ipv4_address: 172.16.72.162
  frontend:
    build: ./frontend
    cpus: 1.0
    mem_limit: 1g
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      localnet:
        ipv4_address: 172.16.72.161 # IP Statis Frontend

volumes:
  postgres_data:

networks:
  localnet:
    name: localnet
    external: true
