server {
  # The frontend has a fixed container IP, so it must listen on the
  # same port users access directly: http://172.16.72.161:8080.
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  # Keep this aligned with the backend upload limit. nginx otherwise rejects
  # requests above its 1 MB default before the API can validate the quota.
  client_max_body_size 20g;
  client_body_timeout 1h;
  send_timeout 1h;
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    # Stream uploads directly to Node instead of first writing the whole
    # request into nginx temporary storage.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
  location / { try_files $uri $uri/ /index.html; }
}
