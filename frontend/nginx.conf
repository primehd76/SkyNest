server {
  # The frontend has a fixed container IP, so it must listen on the
  # same port users access directly: http://172.16.72.161:8080.
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://backend:4000; }
  location / { try_files $uri $uri/ /index.html; }
}
